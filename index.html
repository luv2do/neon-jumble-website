<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Jumble Solver Pro</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* ডেক্সটপ ও মোবাইলের জন্য দুই পাশে পারফেক্ট সাইজ ও মার্জিন */
        .page-container {
            width: 100%;
            max-width: 900px; /* ডেক্সটপে দুই পাশে সুন্দর জায়গা রাখবে */
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* বিজ্ঞাপনের কন্টেইনার স্টাইল */
        .ad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            text-align: center;
        }

        /* মেইন গেম/টুল এরিয়া */
        .main-content {
            width: 100%;
            background: #11141a;
            border: 2px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            border-radius: 10px;
            padding: 25px;
            box-sizing: border-box;
            text-align: center;
        }

        /* আপনার আগের নিয়ন টাইটেল */
        h1 {
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            font-size: 2rem;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* ইনপুট ও বাটন লেআউট */
        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            background: #1f232b;
            border: 1px solid #00ff00;
            color: #fff;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 5px;
            outline: none;
            width: 280px;
            max-width: 100%;
        }

        button {
            background: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 15px #00ff00;
        }

        /* রেজাল্ট বক্স স্টাইল */
        .result-section {
            border-top: 1px solid #333;
            padding-top: 20px;
            text-align: left;
            margin-top: 20px;
        }

        .word-box {
            display: inline-block;
            background: #1f232b;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 3px;
            font-weight: bold;
        }

        .offensive-section {
            border: 1px dashed #ff0000;
            padding: 15px;
            margin-top: 25px;
            border-radius: 5px;
            text-align: left;
        }

        .offensive-title {
            color: #ff0000;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="page-container">

        <!-- ১. উপরের ছোট বিজ্ঞাপনের জায়গা (Top Small Ad) -->
        <div class="ad-container" id="top-ad">
            <!-- ⚠️ আপনার Adsterra থেকে নেওয়া Top Banner (728x90) স্ক্রিপ্ট কোডটি ঠিক নিচে পেস্ট করবেন -->
            
            <!-- ⚠️ স্ক্রিপ্ট বসানোর আগে দেখার জন্য ডামি টেক্সট (কোড বসালে এটি মুছে দেবেন) -->
            <div style="width: 320px; height: 50px; background: #222; color: #666; display: flex; justify-content: center; align-items: center; border: 1px solid #333; font-size: 12px;">Top Ad Slot (728x90 / 320x50)</div>
        </div>

        <!-- মূল অ্যাপ কন্টেন্ট -->
        <main class="main-content">
            <h1>Word Jumble Solver Pro</h1>
            <p class="subtitle">Type scrambled letters and solve them in buttery smooth full screen mode</p>
            
            <div class="input-group">
                <input type="text" id="jumbleInput" placeholder="Enter jumbled letters...">
                <button id="solveBtn">Solve It</button>
            </div>

            <!-- রেজাল্ট দেখানোর জায়গা -->
            <div class="result-section">
                <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">4 Letter Words</div>
                <div id="fourLetterWords">
                    <!-- জুম্বল শব্দ এখানে আসবে -->
                </div>
                
                <div style="color: #666; font-size: 0.9rem; margin-top: 15px; margin-bottom: 5px;">2 Letter Words</div>
                <div id="twoLetterWords">
                    <!-- জুম্বল শব্দ এখানে আসবে -->
                </div>
            </div>

            <!-- অফেনসিভ ওয়ার্ড সেকশন -->
            <div class="offensive-section">
                <div class="offensive-title">HEX OFFENSIVE WORDS</div>
                <div id="offensiveWords">
                    <!-- অফেনসিভ শব্দ এখানে আসবে -->
                </div>
            </div>
        </main>

        <!-- ২. নিচের বড় বিজ্ঞাপনের জায়গা (Bottom Large Ad) -->
        <div class="ad-container" id="bottom-ad">
            <!-- ⚠️ আপনার Adsterra থেকে নেওয়া Bottom Banner (300x250) স্ক্রিপ্ট কোডটি ঠিক নিচে পেস্ট করবেন -->
            
            <!-- ⚠️ স্ক্রিপ্ট বসানোর আগে দেখার জন্য ডামি টেক্সট (কোড বসালে এটি মুছে দেবেন) -->
            <div style="width: 300px; height: 250px; background: #222; color: #666; display: flex; justify-content: center; align-items: center; border: 1px solid #333; font-size: 12px;">Bottom Ad Slot (300x250)</div>
        </div>

    </div>

    <!-- আপনার আগের জাভাস্ক্রিপ্ট ফাইল লিংক -->
    <script src="popup.js"></script>
</body>
</html>
