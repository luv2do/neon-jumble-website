<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Word Jumble Solver Pro - Neon Edition</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117; 
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .main-layout {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
        }
        .ad-sidebar {
            width: 160px;
            background-color: #161b22;
            border: 2px dashed #39ff14; 
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b949e;
            font-size: 14px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
        }
        .game-area {
            flex: 1;
            background: #161b22;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(57, 255, 20, 0.1);
            border: 1px solid #30363d;
            text-align: center;
        }
        h1 { 
            color: #39ff14; 
            text-shadow: 0 0 10px #39ff14, 0 0 20px #39ff14; 
            margin-bottom: 5px; 
            font-size: 32px; 
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .subtitle { 
            color: #8b949e; 
            margin-bottom: 25px; 
            font-size: 15px; 
        }
        .input-group {
            max-width: 500px;
            margin: 0 auto 20px auto;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px 15px;
            font-size: 18px;
            background-color: #0d1117;
            border: 2px solid #30363d;
            border-radius: 4px;
            color: #39ff14; 
            outline: none;
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.5);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { 
            border-color: #39ff14; 
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }
        button {
            background-color: #0d1117;
            color: #39ff14;
            border: 2px solid #39ff14;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
            transition: all 0.2s ease;
        }
        button:hover { 
            background-color: #39ff14;
            color: #0d1117;
            box-shadow: 0 0 20px #39ff14;
        }
        #results {
            margin-top: 25px;
            background: #0d1117;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #30363d;
            display: none;
            text-align: left;
        }
        .word-group {
            margin-bottom: 20px;
            background: #161b22;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #30363d;
        }
        .word-group h4 {
            margin: 0 0 10px 0;
            color: #39ff14;
            border-bottom: 2px solid #39ff14;
            padding-bottom: 5px;
            font-size: 16px;
        }
        .word-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .word-item {
            display: inline-block;
            background: #0d1117;
            padding: 6px 12px;
            margin: 2px;
            border-radius: 4px;
            color: #39ff14; 
            font-size: 15px;
            font-weight: bold;
            border: 1px solid #39ff14;
            box-shadow: 0 0 5px rgba(57, 255, 20, 0.3);
        }
        .offensive-section {
            display: none;
            margin-top: 30px;
            text-align: left;
        }
        .toggle-btn {
            background-color: #0d1117;
            color: #ff3131;
            border: 2px solid #ff3131;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 49, 49, 0.4);
            text-shadow: 0 0 5px #ff3131;
            transition: all 0.2s ease;
        }
        .toggle-btn:hover {
            background-color: #ff3131;
            color: #0d1117;
            box-shadow: 0 0 20px #ff3131;
        }
        #offensiveContainer {
            display: none;
            margin-top: 15px;
            border: 2px dashed #ff3131;
            padding: 15px;
            border-radius: 4px;
            background: #1a0d0d;
            box-shadow: 0 0 10px rgba(255, 49, 49, 0.2);
        }
        .offensive-item {
            border: 1px solid #ff3131 !important;
            color: #ff3131 !important;
            text-shadow: 0 0 3px #ff3131 !important;
            box-shadow: 0 0 5px rgba(255, 49, 49, 0.3) !important;
        }
        .ad-bottom {
            background-color: #161b22;
            border: 2px dashed #39ff14;
            text-align: center;
            padding: 15px;
            color: #8b949e;
            margin: 20px;
            font-size: 14px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <!-- Left Sidebar Ad Banner -->
        <div class="ad-sidebar" id="adLeft">
            [Left Sidebar Ad Container]
        </div>

        <!-- Main Full Screen Game Area -->
        <div class="game-area">
            <h1>Word Jumble Solver Pro</h1>
            <div class="subtitle">Type scrambled letters and solve them in buttery smooth full screen mode</div>
            
            <div class="input-group">
                <input type="text" id="letters" placeholder="Enter jumbled letters..." maxlength="15">
                <button id="solveBtn">Solve It</button>
            </div>
            
            <div id="results"></div>

            <div id="offensiveWrapper" class="offensive-section">
                <button id="toggleOffensiveBtn" class="toggle-btn">Show Offensive Words</button>
                <div id="offensiveContainer">
                    <div id="offensiveList" class="word-list"></div>
                </div>
            </div>
        </div>

        <!-- Right Sidebar Ad Banner -->
        <div class="ad-sidebar" id="adRight">
            [Right Sidebar Ad Container]
        </div>
    </div>

    <!-- Bottom Banner Ad -->
    <div class="ad-bottom" id="adBottom">
        [Bottom Banner Advertisement Place]
    </div>

    <script src="popup.js"></script>
</body>
</html>
