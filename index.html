<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUMBLEVERSE</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .page-container {
            width: 100%;
            max-width: 95%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            text-align: center;
        }

        .main-content {
            width: 100%;
            max-width: 1200px;
            background: #11141a;
            border: 2px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            border-radius: 10px;
            padding: 35px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            font-size: 3rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 2px;
        }

        p.subtitle {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            background: #1f232b;
            border: 1px solid #00ff00;
            color: #fff;
            padding: 15px 25px;
            font-size: 1.1rem;
            border-radius: 5px;
            outline: none;
            width: 400px;
            max-width: 100%;
        }

        button {
            background: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 15px #00ff00;
        }

        .result-section {
            border-top: 1px solid #333;
            padding-top: 25px;
            text-align: left;
            margin-top: 25px;
        }

        /* প্রতিটা অক্ষরের গ্রুপের জন্য ডাইনামিক স্টাইল */
        .word-group {
            margin-bottom: 20px;
        }

        .group-title {
            color: #888;
            font-size: 1rem;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .word-box {
            display: inline-block;
            background: #1f232b;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1rem;
        }

        .offensive-section {
            border: 2px dashed #ff0000;
            padding: 20px;
            margin-top: 30px;
            border-radius: 5px;
            text-align: left;
            background: rgba(255, 0, 0, 0.02);
        }

        .offensive-title {
            color: #ff0000;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="ad-container" id="top-ad"></div>

        <main class="main-content">
            <h1>JUMBLEVERSE</h1>
            <p class="subtitle">Type scrambled letters and solve them in buttery smooth full screen mode</p>
            
            <div class="input-group">
                <input type="text" id="jumbleInput" placeholder="Enter up to 20 jumbled letters...">
                <button id="solveBtn">Solve It</button>
            </div>

            <!-- ডাইনামিক রেজাল্ট এরিয়া (২ থেকে ৭ অক্ষরের শব্দ এখানে অটোমেটিক লোড হবে) -->
            <div class="result-section" id="resultsContainer"></div>

            <div class="offensive-section">
                <div class="offensive-title">HEX OFFENSIVE WORDS</div>
                <div id="offensiveWords"></div>
            </div>
        </main>

        <div class="ad-container" id="bottom-ad"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
